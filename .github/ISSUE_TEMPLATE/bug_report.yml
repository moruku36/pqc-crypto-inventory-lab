name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal command to reproduce the behavior.
      placeholder: |
        1. Run `pqc-scan directory ./path`
        2. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, package version.
      placeholder: |
        - OS: Ubuntu 22.04 / macOS Sonoma / Windows 11
        - Python: 3.11.x
        - pqc-scan version: 0.1.0
    validations:
      required: true
